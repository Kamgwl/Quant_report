// ── CASH STRATEGY DETECTION ────────────────────────────────────────────────────
const CASH_STRATEGIES = ["CASH", "cash", "ETF", "NA"];
function isCashStrategy(r) {
return CASH_STRATEGIES.includes(r.strategy) ||
r.name.toLowerCase().includes("cash") ||
r.name.toLowerCase().includes("etf");
}

// ── COMPUTED DATA ─────────────────────────────────────────────────────────────
// Annualized ROI = Q1 ROI x 4 (3 months elapsed → x4 to project full year)
const MONTHS_ELAPSED = 3;
const ANN_FACTOR = 12 / MONTHS_ELAPSED; // 4

function enrichRow(r) {
const apr_roi = r.apr_roi / 100;
const may_roi = r.may_roi / 100;
const jun_roi = r.jun_roi / 100;
const q1 = r.apr + r.may + r.jun;
const q1_roi = apr_roi + may_roi + jun_roi;
const ann_roi = q1_roi * ANN_FACTOR;
const ann_pnl = q1 * ANN_FACTOR;
return { ...r, apr_roi, may_roi, jun_roi, q1, q1_roi, ann_roi, ann_pnl, isCash: isCashStrategy(r) };
}

const DATA_ALL = RAW.map(enrichRow);
const DATA_CASH = DATA_ALL.filter(r => r.isCash);
const DATA = DATA_ALL.filter(r => !r.isCash);

];

const fmt = (n) => {
if (Math.abs(n) >= 1e7) return `₹${(n/1e7).toFixed(2)}Cr`;
if (Math.abs(n) >= 1e5) return `₹${(n/1e5).toFixed(2)}L`;
if (Math.abs(n) >= 1e3) return `₹${(n/1e3).toFixed(1)}K`;
return `₹${n.toLocaleString("en-IN")}`;
};
// Fund is in Crores: display as ₹X.XXCr or ₹XL (if < 1Cr)
const fmtFund = (cr) => cr >= 1 ? `₹${cr.toFixed(2)}Cr` : `₹${(cr*100).toFixed(0)}L`;
const fmtROI = (n) => `${(n*100).toFixed(2)}%`;
const fmtSign = (n) => n >= 0 ? `+${fmt(n)}` : fmt(n);

                                    <span style={{ background: s.pnl>= 0 ? "rgba(34,197,94,0.15)" :
                                        "rgba(244,63,94,0.15)", color: s.pnl >= 0 ? POS : NEG, padding: "3px 10px",
                                        borderRadius: 20, fontSize: 11, fontWeight: 700 }}>
                                        {s.pnl >= 0 ? "PROFIT" : "LOSS"}
                                    </span>
                                </td>
                            </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
            )}

            {/* ── YEARLY PROJECTION ── */}
            {view === "yearly" && (() => {
            const annRanked = [...DATA].filter(r => r.q1 !== 0).sort((a, b) => b.ann_roi - a.ann_roi);
            const totalFund = DATA.reduce((s, r) => s + r.fund, 0);
            const q1PnL = DATA.reduce((s, r) => s + r.q1, 0);
            const q1ROI = totalFund > 0 ? q1PnL / (totalFund * 1e7) : 0;
            const annROI = q1ROI * ANN_FACTOR;
            const annPnL = q1PnL * ANN_FACTOR;

            const monthlyAnn = [
            { month: "April", roi: totalFund > 0 ? +(DATA.reduce((s,r)=>s+r.apr,0) / (totalFund*1e7) * 12 * 100).toFixed(2) : 0 },
            { month: "May", roi: totalFund > 0 ? +(DATA.reduce((s,r)=>s+r.may,0) / (totalFund*1e7) * 12 * 100).toFixed(2) : 0 },
            { month: "June", roi: totalFund > 0 ? +(DATA.reduce((s,r)=>s+r.jun,0) / (totalFund*1e7) * 12 * 100).toFixed(2) : 0 },
            { month: "Q1 Ann", roi: +(annROI * 100).toFixed(2) },
            ];

            return (
            <div>
                <div style={{ background:"rgba(251,191,36,0.07)", border:"1px solid rgba(251,191,36,0.3)",
                    borderRadius:10, padding:"12px 18px", marginBottom:24, display:"flex", alignItems:"center", gap:10
                    }}>
                    <span style={{fontSize:18}}>📅</span>
                    <span style={{color:"#fbbf24", fontSize:13}}>
                        Annual ROI is <strong>projected</strong> by extrapolating Q1 (3-month) performance × 4.
                        Only 3 of 12 months are complete — use these figures as a run-rate, not a guarantee.
                    </span>
                </div>

                {/* Portfolio-level annual KPIs */}
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:12,
                    marginBottom:24 }}>
                    <StatCard label="Total AUM" value={fmtFund(totalFund)} sub="Total Utilized Fund" color={ACCENT} />
                    <StatCard label="Q1 ROI (3M)" value={fmtROI(q1ROI)} sub="Apr + May + Jun" color={q1ROI>=0?POS:NEG}
                        />
                        <StatCard label="Projected Annual ROI" value={fmtROI(annROI)} sub="Q1 × 4" color={annROI>=0?"#fbbf24":NEG} />
                            <StatCard label="Projected Annual P&L" value={fmtSign(annPnL)} sub="Run-rate" color={annPnL>=0?"#fbbf24":NEG} />
                                <StatCard label="Best Annual ROI" value={fmtROI(annRanked[0]?.ann_roi)}
                                    sub={annRanked[0]?.name} color={POS} />
                                <StatCard label="Worst Annual ROI"
                                    value={fmtROI(annRanked[annRanked.length-1]?.ann_roi)}
                                    sub={annRanked[annRanked.length-1]?.name} color={NEG} />
                </div>

                {/* Monthly annualized bar */}
                <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:24, marginBottom:28}}>
                    <div style={{background:CARD, borderRadius:12, padding:20, border:`1px solid ${BORDER}`}}>
                        <div style={{color:"#6b8cbb", fontSize:12, fontWeight:700, marginBottom:14}}>ANNUALIZED ROI BY
                            MONTH (%)</div>
                        <div style={{color:"#4a6490", fontSize:11, marginBottom:10}}>Each month's ROI extrapolated to 12
                            months</div>
                        <ResponsiveContainer width="100%" height={200}>
                            <BarChart data={monthlyAnn} barSize={44}>
                                <CartesianGrid strokeDasharray="3 3" stroke={BORDER} />
                                <XAxis dataKey="month" tick={{fill:"#6b8cbb",fontSize:12}} axisLine={false}
                                    tickLine={false} />
                                <YAxis tick={{fill:"#6b8cbb",fontSize:11}} tickFormatter={v=>`${v}%`} axisLine={false}
                                    tickLine={false} />
                                    <Tooltip formatter={(v)=>`${v.toFixed(2)}%`}
                                        contentStyle={{background:"#111d33",border:`1px solid
                                        ${BORDER}`,borderRadius:8,fontSize:12}} />
                                        <ReferenceLine y={0} stroke={BORDER} />
                                        <Bar dataKey="roi" name="Ann. ROI %" radius={[6,6,0,0]}>
                                            {monthlyAnn.map((d,i)=><Cell key={i} fill={d.roi>=0?"#fbbf24":NEG}/>)}
                                        </Bar>
                            </BarChart>
                        </ResponsiveContainer>
                    </div>

                    {/* Top 10 annual performers */}
                    <div style={{background:CARD, borderRadius:12, padding:20, border:`1px solid ${BORDER}`}}>
                        <div style={{color:"#6b8cbb", fontSize:12, fontWeight:700, marginBottom:14}}>TOP 10 — PROJECTED
                            ANNUAL ROI</div>
                        {annRanked.slice(0,10).map((r,i)=>(
                        <div key={r.code}
                            style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<9?`1px solid ${BORDER}22`:"none"}}>
                            <div style={{display:"flex",gap:8,alignItems:"center"}}>
                                <div
                                    style={{width:20,height:20,borderRadius:"50%",background:i<3?"#fbbf24":POS,color:"#000",fontWeight:800,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
                                    {i+1}</div>
                                <div>
                                    <div style={{fontWeight:600,fontSize:12}}>{r.name}</div>
                                    <div style={{color:"#4a6490",fontSize:10}}>₹{r.fund}L · {r.strategy||"—"}</div>
                                </div>
                            </div>
                            <div style={{textAlign:"right"}}>
                                <div style={{color:"#fbbf24",fontWeight:800,fontFamily:"'DM Mono',monospace",fontSize:13}}>{fmtROI(r.ann_roi)}</div>
                                <div style={{color:"#6b8cbb",fontSize:10}}>{fmtSign(r.ann_pnl)} proj.</div>
                            </div>
                        </div>
                        ))}
                    </div>
                </div>

                {/* Full annual ranking bar */}
                <div style={{marginBottom:8}}>
                    {sectionHead("All Users — Projected Annual ROI (Best → Worst)")}
                </div>
                <div style={{background:CARD, borderRadius:12, padding:20, border:`1px solid ${BORDER}`,
                    marginBottom:28}}>
                    <ResponsiveContainer width="100%" height={Math.max(500, annRanked.length*22)}>
                        <BarChart data={annRanked.map(r=>({ name:r.name.length>14?r.name.slice(0,14)+"…":r.name,
                            fullName:r.name, ann_roi:+(r.ann_roi*100).toFixed(2), ann_pnl:r.ann_pnl, fund:r.fund,
                            q1_roi:r.q1_roi }))} layout="vertical" barSize={14} margin={{left:110}}>
                            <CartesianGrid strokeDasharray="3 3" stroke={BORDER} horizontal={false} />
                            <XAxis type="number" tick={{fill:"#6b8cbb",fontSize:11}} tickFormatter={v=>`${v}%`}
                                axisLine={false} tickLine={false} />
                                <YAxis type="category" dataKey="name" tick={{fill:"#b0c4de",fontSize:10}}
                                    axisLine={false} tickLine={false} width={110} />
                                <Tooltip content={({active,payload})=>{
                                    if(!active||!payload?.length) return null;
                                    const d=payload[0]?.payload;
                                    return(
                                    <div style={{background:"#111d33",border:`1px solid
                                        ${BORDER}`,borderRadius:8,padding:"10px 14px",fontSize:12}}>
                                        <div style={{color:"#fbbf24",fontWeight:700}}>{d?.fullName}</div>
                                        <div style={{color:"#6b8cbb",fontSize:11}}>Fund: ₹{d?.fund}L</div>
                                        <div style={{color:d?.ann_roi>=0?"#fbbf24":NEG}}>Projected Annual ROI:
                                            {d?.ann_roi?.toFixed(2)}%</div>
                                        <div style={{color:d?.ann_roi>=0?"#fbbf24":NEG}}>Projected Annual P&L:
                                            {fmt(d?.ann_pnl)}</div>
                                        <div style={{color:"#4a6490",fontSize:10}}>Q1 actual ROI:
                                            {(d?.q1_roi*100)?.toFixed(2)}%</div>
                                    </div>
                                    );
                                    }} />
                                    <ReferenceLine x={0} stroke={BORDER} />
                                    <Bar dataKey="ann_roi" name="Annual ROI %" radius={[0,4,4,0]}>
                                        {annRanked.map((d,i)=><Cell key={i} fill={d.ann_roi>=0?"#fbbf24":NEG}/>)}
                                    </Bar>
                        </BarChart>
                    </ResponsiveContainer>
                </div>

                {/* Full detail table */}
                {sectionHead("Annual ROI Projection — Full Table")}
                <div style={{background:CARD, borderRadius:12, border:`1px solid ${BORDER}`, overflow:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead>
                            <tr style={{background:"#0a1020",borderBottom:`1px solid ${BORDER}`}}>
                                {["#","Code","Name","Strategy","Fund (Cr)","Q1 P&L","Q1 ROI","Proj. Annual ROI","Proj. Annual P&L","Status"].map(h=>(
                                <th key={h} style={{padding:"12px 10px",textAlign:"left",color:"#6b8cbb",fontWeight:700,letterSpacing:1,whiteSpace:"nowrap"}}>
                                    {h}</th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {annRanked.map((r,i)=>(
                            <tr key={r.code} style={{background:i%2===0?CARD:"#0d1423",borderBottom:`1px solid
                                ${BORDER}22`}}>
                                <td style={{padding:"10px",color:"#4a6490"}}>{i+1}</td>
                                <td style={{padding:"10px",color:ACCENT,fontFamily:"'DM Mono',monospace",fontSize:11}}>
                                    {r.code}</td>
                                <td style={{padding:"10px",fontWeight:600,whiteSpace:"nowrap"}}>{r.name}</td>
                                <td style={{padding:"10px",color:"#6b8cbb",fontSize:11}}>{r.strategy||"—"}</td>
                                <td style={{padding:"10px",fontFamily:"'DM Mono',monospace",color:"#94a3b8"}}>{r.fund}
                                </td>
                                <td style={{padding:"10px",fontFamily:"'DM Mono',monospace",color:r.q1>=0?POS:NEG,whiteSpace:"nowrap"}}>{fmtSign(r.q1)}</td>
                                <td style={{padding:"10px",fontFamily:"'DM Mono',monospace",color:r.q1_roi>=0?POS:NEG}}>{fmtROI(r.q1_roi)}</td>
                                <td style={{padding:"10px",fontFamily:"'DM Mono',monospace",color:r.ann_roi>=0?"#fbbf24":NEG,fontWeight:700,fontSize:13}}>{fmtROI(r.ann_roi)}</td>
                                <td style={{padding:"10px",fontFamily:"'DM Mono',monospace",color:r.ann_pnl>=0?"#fbbf24":NEG,whiteSpace:"nowrap"}}>{fmtSign(r.ann_pnl)}</td>
                                <td style={{padding:"10px"}}>
                                    <span
                                        style={{background:r.ann_roi>=0?"rgba(251,191,36,0.15)":"rgba(244,63,94,0.15)",color:r.ann_roi>=0?"#fbbf24":NEG,padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700}}>
                                        {r.ann_roi>=0?"ON TRACK":"LOSS"}
                                    </span>
                                </td>
                            </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
                <div style={{color:"#4a6490",fontSize:11,marginTop:12,textAlign:"right"}}>
                    * Annualized projection based on Q1 (Apr–Jun 2026) performance × 4. Actual results may vary.
                </div>
            </div>
            );
            })()}

            {/* ── CASH / ETF / ATS ── */}
            {view === "cash" && (() => {
            const cashRanked = [...DATA_CASH].filter(r => r.q1 !== 0).sort((a, b) => b.q1_roi - a.q1_roi);
            const cashTotalFund = DATA_CASH.reduce((s, r) => s + r.fund, 0);
            const cashApr = DATA_CASH.reduce((s, r) => s + r.apr, 0);
            const cashMay = DATA_CASH.reduce((s, r) => s + r.may, 0);
            const cashJun = DATA_CASH.reduce((s, r) => s + r.jun, 0);
            const cashQ1 = cashApr + cashMay + cashJun;
            const cashQ1ROI = cashTotalFund > 0 ? cashQ1 / (cashTotalFund * 1e5) : 0;
            const cashTrend = [
            { month: "April", pnl: cashApr, roi: cashTotalFund > 0 ? +(cashApr / (cashTotalFund * 1e5) * 100).toFixed(2)
            : 0 },
            { month: "May", pnl: cashMay, roi: cashTotalFund > 0 ? +(cashMay / (cashTotalFund * 1e5) * 100).toFixed(2) :
            0 },
            { month: "June", pnl: cashJun, roi: cashTotalFund > 0 ? +(cashJun / (cashTotalFund * 1e5) * 100).toFixed(2)
            : 0 },
            ];
            return (
            <div>
                {/* Notice banner */}
                <div style={{ background: "rgba(234,179,8,0.08)" , border: "1px solid rgba(234,179,8,0.3)" ,
                    borderRadius: 10, padding: "12px 18px" , marginBottom: 24, display: "flex" , alignItems: "center" ,
                    gap: 10 }}>
                    <span style={{ fontSize: 18 }}>💰</span>
                    <span style={{ color: "#fbbf24" , fontSize: 13 }}>
                        Cash / ETF / ATS accounts are shown <strong>separately</strong> here and excluded from all other
                        reports to avoid skewing F&O strategy numbers.
                    </span>
                </div>

                {/* KPIs */}
                <div style={{ display: "grid" , gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))" , gap: 12,
                    marginBottom: 24 }}>
                    <StatCard label="Cash AUM" value={`₹${cashTotalFund.toFixed(1)}L`}
                        sub={`₹${(cashTotalFund/100).toFixed(2)} Cr`} color="#fbbf24" />
                    <StatCard label="Q1 Net P&L" value={fmtSign(cashQ1)} color={cashQ1>= 0 ? POS : NEG} />
                        <StatCard label="Q1 ROI" value={fmtROI(cashQ1ROI)} color={cashQ1ROI>= 0 ? POS : NEG} />
                            <StatCard label="April P&L" value={fmtSign(cashApr)} color={cashApr>= 0 ? POS : NEG} />
                                <StatCard label="May P&L" value={fmtSign(cashMay)} color={cashMay>= 0 ? POS : NEG} />
                                    <StatCard label="June P&L" value={fmtSign(cashJun)} color={cashJun>= 0 ? POS : NEG}
                                        />
                </div>

                {/* Trend charts */}
                {sectionHead("Cash / ETF Monthly Trend")}
                <div style={{ display: "grid" , gridTemplateColumns: "1fr 1fr" , gap: 24, marginBottom: 28 }}>
                    <div style={{ background: CARD, borderRadius: 12, padding: 20, border: `1px solid ${BORDER}` }}>
                        <div style={{ color: "#6b8cbb" , fontSize: 12, fontWeight: 700, marginBottom: 14 }}>MONTHLY NET
                            P&L (₹)</div>
                        <ResponsiveContainer width="100%" height={200}>
                            <BarChart data={cashTrend} barSize={50}>
                                <CartesianGrid strokeDasharray="3 3" stroke={BORDER} />
                                <XAxis dataKey="month" tick={{ fill: "#6b8cbb" , fontSize: 12 }} axisLine={false}
                                    tickLine={false} />
                                <YAxis tick={{ fill: "#6b8cbb" , fontSize: 11 }} tickFormatter={v=> fmt(v)}
                                    axisLine={false} tickLine={false} />
                                    <Tooltip content={<CustomTooltip />} />
                                    <ReferenceLine y={0} stroke={BORDER} />
                                    <Bar dataKey="pnl" name="Net P&L" radius={[6,6,0,0]}>
                                        {cashTrend.map((d, i) => <Cell key={i} fill={d.pnl>= 0 ? "#fbbf24" : NEG} />)}
                                    </Bar>
                            </BarChart>
                        </ResponsiveContainer>
                    </div>
                    <div style={{ background: CARD, borderRadius: 12, padding: 20, border: `1px solid ${BORDER}` }}>
                        <div style={{ color: "#6b8cbb" , fontSize: 12, fontWeight: 700, marginBottom: 14 }}>MONTHLY ROI
                            (%)</div>
                        <ResponsiveContainer width="100%" height={200}>
                            <LineChart data={cashTrend}>
                                <CartesianGrid strokeDasharray="3 3" stroke={BORDER} />
                                <XAxis dataKey="month" tick={{ fill: "#6b8cbb" , fontSize: 12 }} axisLine={false}
                                    tickLine={false} />
                                <YAxis tick={{ fill: "#6b8cbb" , fontSize: 11 }} tickFormatter={v=> `${v}%`}
                                    axisLine={false} tickLine={false} />
                                    <Tooltip content={<CustomTooltip />} />
                                    <ReferenceLine y={0} stroke={BORDER} />
                                    <Line dataKey="roi" name="ROI %" stroke="#fbbf24" strokeWidth={3} dot={{
                                        fill: "#fbbf24" , r: 6 }} />
                            </LineChart>
                        </ResponsiveContainer>
                    </div>
                </div>

                {/* Q1 bar chart */}
                {sectionHead("Cash / ETF — Best to Worst (Q1)")}
                <div style={{ background: CARD, borderRadius: 12, padding: 20, border: `1px solid ${BORDER}`,
                    marginBottom: 28 }}>
                    <ResponsiveContainer width="100%" height={Math.max(200, cashRanked.length * 38)}>
                        <BarChart data={cashRanked.map(r=> ({ name: r.name.length > 16 ? r.name.slice(0,16)+"…" :
                            r.name, pnl: r.q1, roi: +(r.q1_roi*100).toFixed(2), fund: r.fund, fullName: r.name,
                            strategy: r.strategy }))} layout="vertical" barSize={20} margin={{ left: 130 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke={BORDER} horizontal={false} />
                            <XAxis type="number" tick={{ fill: "#6b8cbb" , fontSize: 11 }} tickFormatter={v=> fmt(v)}
                                axisLine={false} tickLine={false} />
                                <YAxis type="category" dataKey="name" tick={{ fill: "#b0c4de" , fontSize: 11 }}
                                    axisLine={false} tickLine={false} width={130} />
                                <Tooltip content={({ active, payload })=> {
                                    if (!active || !payload?.length) return null;
                                    const d = payload[0]?.payload;
                                    return (
                                    <div style={{ background: "#111d33" , border: `1px solid ${BORDER}`, borderRadius:
                                        8, padding: "10px 14px" , fontSize: 12 }}>
                                        <div style={{ color: "#fbbf24" , fontWeight: 700 }}>{d?.fullName}</div>
                                        <div style={{ color: "#6b8cbb" , fontSize: 11 }}>{d?.strategy || "—"} ·
                                            ₹{d?.fund}Cr</div>
                                        <div style={{ color: d?.pnl>= 0 ? POS : NEG }}>Q1 P&L: {fmt(d?.pnl)}</div>
                                        <div style={{ color: d?.roi>= 0 ? POS : NEG }}>Annual ROI: {d?.roi?.toFixed(2)}%
                                        </div>
                                    </div>
                                    );
                                    }} />
                                    <ReferenceLine x={0} stroke={BORDER} />
                                    <Bar dataKey="pnl" name="Q1 P&L" radius={[0,4,4,0]}>
                                        {cashRanked.map((d, i) => <Cell key={i} fill={d.q1>= 0 ? "#fbbf24" : NEG} />)}
                                    </Bar>
                        </BarChart>
                    </ResponsiveContainer>
                </div>

                {/* Detail table */}
                {sectionHead("Cash / ETF Account Detail")}
                <div style={{ background: CARD, borderRadius: 12, border: `1px solid ${BORDER}`, overflow: "auto" }}>
                    <table style={{ width: "100%" , borderCollapse: "collapse" , fontSize: 12 }}>
                        <thead>
                            <tr style={{ background: "#0a1020" , borderBottom: `1px solid ${BORDER}` }}>
                                {["#","Code","Name","Strategy","Fund (Cr)","Apr P&L","May P&L","Jun P&L","Q1 P&L","Q1 ROI"].map(h => (
                                <th key={h} style={{ padding:"12px 10px", textAlign:"left", color:"#6b8cbb",
                                    fontWeight:700, letterSpacing:1, whiteSpace:"nowrap" }}>{h}</th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {cashRanked.map((r, i) => (
                            <tr key={r.code} style={{ background: i % 2===0 ? CARD : "#0d1423" , borderBottom: `1px
                                solid ${BORDER}22` }}>
                                <td style={{ padding:"10px", color:"#4a6490" }}>{i+1}</td>
                                <td style={{ padding:"10px", color:"#fbbf24", fontFamily:"'DM Mono',monospace",
                                    fontSize:11 }}>{r.code}</td>
                                <td style={{ padding:"10px", fontWeight:600 }}>{r.name}</td>
                                <td style={{ padding:"10px", color:"#6b8cbb", fontSize:11 }}>{r.strategy || "—"}</td>
                                <td style={{ padding:"10px", fontFamily:"'DM Mono',monospace", color:"#94a3b8" }}>
                                    {r.fund}</td>
                                {[r.apr, r.may, r.jun, r.q1].map((v, j) => (
                                <td key={j} style={{ padding:"10px", fontFamily:"'DM Mono',monospace", color: v>= 0 ?
                                    POS : NEG, whiteSpace:"nowrap" }}>{v === 0 ? "—" : fmtSign(v)}</td>
                                ))}
                                <td style={{ padding:"10px", fontFamily:"'DM Mono',monospace", color: r.q1_roi>= 0 ? POS
                                    : NEG }}>{fmtROI(r.q1_roi)}</td>
                            </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
            );
            })()}

        </div>

        <div style={{ textAlign: "center" , color: "#1e2d4a" , fontSize: 11, marginTop: 20 }}>
            Quant Strategy FY 2026–27 · Data sourced from uploaded Excel · Q2–Q4 pending
        </div>
    </div>
    );
    }

// Mount the Dashboard
const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(React.createElement(Dashboard));
  </script>
